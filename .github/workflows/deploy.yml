name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # rustup on the runner reads rust-toolchain.toml, so CI and local runs
      # share one pinned toolchain (channel, components, wasm target).
      - name: Install pinned Rust toolchain
        run: rustup toolchain install

      - uses: Swatinem/rust-cache@v2

      - name: Install Trunk and cargo-llvm-cov
        uses: taiki-e/install-action@v2
        with:
          tool: trunk@0.21.14,cargo-llvm-cov

      # Same gate as local `make test-ci`: fmt, clippy, unit tests with the
      # coverage floor. Runs before the build so a red gate ships no artifact.
      - name: Lint and test
        run: make test-ci

      - name: Build
        run: trunk build --release --locked --public-url /

      - name: SPA fallback for GitHub Pages
        run: cp dist/index.html dist/404.html

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
